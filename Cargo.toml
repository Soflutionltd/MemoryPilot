[workspace]
members = ["crates/memorypilot-core", "crates/memorypilot-server"]
default-members = [".", "crates/memorypilot-core", "crates/memorypilot-server"]

[workspace.package]
version = "4.13.0"

[package]
name = "MemoryPilot"
version.workspace = true
edition = "2021"
authors = ["SOFLUTION LTD"]
description = "God-Tier MCP memory server — Hybrid search (BM25 + jina-embeddings-v5 RRF + cross-encoder rerank), hierarchical episodic memory, 100+ languages, Temporal Knowledge Graph, GC, Project Brain, File Watcher, HTTP server."
license-file = "LICENSE"
repository = "https://github.com/Soflutionltd/MemoryPilot"
keywords = ["mcp", "memory", "sqlite", "cursor", "ai"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "MemoryPilot"
path = "src/main.rs"

[dependencies]
memorypilot-core = { path = "crates/memorypilot-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled", "modern_sqlite"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
# FSEvents on macOS: kqueue holds one descriptor per watched file, which
# exhausted the descriptor table (and broke every subprocess spawn).
notify = "6"
tiny_http = { version = "0.12", optional = true }
chacha20poly1305 = "0.10"
# Automatic updates (src/update.rs): signed manifest, HTTPS download, digest.
ureq = { version = "3", default-features = false, features = ["rustls"] }
minisign-verify = "0.3"
sha2 = "0.11"

[target.'cfg(unix)'.dependencies]
# poll(2) on stdin between requests, liveness of crashed-boot markers.
rustix = { version = "1", default-features = false, features = ["std", "event", "process"] }

[features]
default = ["http"]
http = ["tiny_http"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
