[package]
name = "memorypilot-server"
version.workspace = true
edition = "2021"
authors = ["SOFLUTION LTD"]
description = "MemoryPilot server mode: multi-tenant Postgres storage (tsvector + pgvector) behind the core store traits."
license-file = "../../LICENSE"
repository = "https://github.com/Soflutionltd/MemoryPilot"
publish = false

[dependencies]
memorypilot-core = { path = "../memorypilot-core" }
postgres = { version = "0.19.14", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
pgvector = { version = "0.4.2", features = ["postgres"] }
chrono = "0.4"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
unicode-normalization = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }
webpki-roots = "1"
ring = "0.17"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
form_urlencoded = "1"
tiny_http = "0.12"

[dev-dependencies]
memorypilot-core = { path = "../memorypilot-core", features = ["store-contract"] }
