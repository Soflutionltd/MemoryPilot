version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      mineures-et-correctifs:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      mineures-et-correctifs:
        update-types:
          - "minor"
          - "patch"
