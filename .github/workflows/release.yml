name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)build for"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # A tag whose tests fail on Linux publishes nothing.
  test:
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

  build:
    name: build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is built, signed and notarized on the Developer ID Mac by
        # scripts/release-macos.sh: an unsigned build here would replace it
        # (upload --clobber) and bring back Keychain prompts after updates.
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            cross: false
    steps:
      # A manual run rebuilds the tag it names, never the branch it is
      # started from: its archives replace the ones of that release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Check that the sources are the tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)"
          if [ "v${version}" != "$TAG" ]; then
            echo "::error::${TAG} checked out, but Cargo.toml says v${version}"
            exit 1
          fi

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Build release (native)
        if: matrix.cross == false
        run: cargo build --release --locked --features http --target ${{ matrix.target }} --bin MemoryPilot

      - name: Build release (cross)
        if: matrix.cross == true
        run: cross build --release --locked --features http --target ${{ matrix.target }} --bin MemoryPilot

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/MemoryPilot" "$stage/"
          archive="MemoryPilot-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" -C "$stage" MemoryPilot
          shasum -a 256 "$archive" > "$archive.sha256"
          ls -lh "$archive"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MemoryPilot-${{ matrix.target }}
          path: |
            MemoryPilot-${{ matrix.target }}.tar.gz
            MemoryPilot-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Archives rebuilt for a tag whose update manifest is already
          # published would no longer match the digests that manifest signs.
          if gh release view "${{ steps.tag.outputs.tag }}" --repo "${{ github.repository }}" --json assets -q '.assets[].name' | grep -qx "latest.json"; then
            echo "::error::${{ steps.tag.outputs.tag }} is already announced to the updater (latest.json is on the release): publish a new version instead"
            exit 1
          fi
          if ! gh release view "${{ steps.tag.outputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "${{ steps.tag.outputs.tag }}" \
              --repo "${{ github.repository }}" \
              --title "MemoryPilot ${{ steps.tag.outputs.tag }}" \
              --generate-notes
          fi
          gh release upload "${{ steps.tag.outputs.tag }}" dist/*.tar.gz dist/*.sha256 \
            --repo "${{ github.repository }}" \
            --clobber
